project:
  type: website
  output-dir: _book
  resources:
    - fonts/
    - images/icons/
    - images/favicon/
    - images/social-card.jpg
    # Scripts of the interactive pages (fit-demo.js, quiz.js), loaded with <script> tags.
    - assets/
  # Redirect pages for the old addresses of pages that moved (tools/old_page_urls.py).
  post-render: tools/old_page_urls.py

website:
  title: "Introduction to Machine Learning"
  page-navigation: true
  site-url: https://ai.buas.nl/open-courses/introduction-to-ml/
  # Browser-tab icon: the department site's icon (copied from adsai-department-site).
  favicon: images/favicon/favicon.png
  # Link previews (WhatsApp, Teams, LinkedIn, ...): Open Graph and Twitter tags. The
  # image is set for all pages further down (top-level `image:`).
  description: "A free, open machine-learning course from Breda University of Applied Sciences: learn the concepts, apply them to a real client problem, and test your solution on unseen molecules."
  open-graph: true
  twitter-card:
    card-style: summary_large_image

  # Early-release banner on every page (dismissable).
  announcement:
    # Links in the banner are not rewritten per page: use an absolute URL.
    content: "**Early release v0.6.** This course is still being finished: pages may change. You can [score your predictions](https://ai.buas.nl/open-courses/introduction-to-ml/datalab/iteration-3/00_overview.html#scoring-your-predictions) on the test set at any time. [What's new](https://ai.buas.nl/open-courses/introduction-to-ml/whats-new.html)"
    type: info
    icon: info-circle
    dismissable: true
    position: below-navbar

  page-footer:
    left: >-
      © 2025–2026 [Breda University of Applied Sciences](https://www.buas.nl) ·
      Content [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/), code
      [MIT](https://github.com/BredaUniversityADSAI/introduction-to-ml/blob/main/LICENSE.md)
    right: "[Applied Data Science & AI](https://ai.buas.nl/)"

  # "Report an issue" link (with GitHub icon) under each page's table of contents.
  repo-url: https://github.com/BredaUniversityADSAI/introduction-to-ml
  repo-actions: [issue]

  # The sidebar defines both the visual hierarchy and the previous/next order.
  # Self-study is nested Self-study -> Theme -> Activity, which a book's
  # `chapters`/`part` cannot express (it allows only one level of parts).
  sidebar:
    style: floating
    collapse-level: 1
    # Icons under the sidebar title. The dark-mode toggle is added next to
    # them automatically because a dark theme is configured below.
    tools:
      - icon: github
        href: https://github.com/BredaUniversityADSAI/introduction-to-ml
        aria-label: GitHub repository
      - icon: chat-dots
        href: https://github.com/BredaUniversityADSAI/introduction-to-ml/discussions
        aria-label: Discussions (questions and help)

    contents:
    - index.qmd
    - href: course-guide.qmd
      text: "Course Guide"
    - href: setup.qmd
      text: "Set up your computer"

    # Self-study: Self-study -> Theme -> Activity, one folder per theme (self-study/theme-N/),
    # files numbered in this order, the overview page first (00_overview.qmd), like the
    # DataLab iterations. Keep the file numbers in step with this order.
    # `text` sets the sidebar label; the page keeps its own heading.
    - section: self-study/00_overview.qmd
      contents:
        - section: "1. Foundations of Machine Learning"
          href: self-study/theme-1/00_overview.qmd
          contents:
            - href: self-study/theme-1/01_what_is_machine_learning.qmd
              text: "What is Machine Learning?"
            - href: self-study/theme-1/02_getting_started.ipynb
              text: "Getting Started"
            - href: self-study/theme-1/03_classification.ipynb
              text: "Classification"
            - href: self-study/theme-1/04_regression.ipynb
              text: "Regression"
            - href: self-study/theme-1/05_unsupervised_learning.ipynb
              text: "Unsupervised Learning"
            - href: self-study/theme-1/06_end_to_end_ml.ipynb
              text: "End-to-End ML Project"

        - section: "2. Data Preparation & Understanding"
          href: self-study/theme-2/00_overview.qmd
          contents:
            - href: self-study/theme-2/01_data_prep.ipynb
              text: "Data Preparation"
            - href: self-study/theme-2/02_data_understanding.ipynb
              text: "Data Understanding"
            - href: self-study/theme-2/03_leakage_and_distribution_shift.qmd
              text: "Leakage & Distribution Shift"

        - section: "3. Modeling & Evaluation"
          href: self-study/theme-3/00_overview.qmd
          contents:
            - href: self-study/theme-3/01_modeling_and_evaluation.ipynb
              text: "Modeling & Evaluation"
            - href: self-study/theme-3/02_linear_regression.ipynb
              text: "Linear Regression"
            - href: self-study/theme-3/03_logistic_regression.ipynb
              text: "Logistic Regression"
            - href: self-study/theme-3/04_clustering.ipynb
              text: "Clustering"

        - section: "4. Advanced Scikit-Learn"
          href: self-study/theme-4/00_overview.qmd
          contents:
            - href: self-study/theme-4/01_pipelines_and_columntransformer.ipynb
              text: "Pipelines & ColumnTransformer"

        - section: "5. Tree-Based Algorithms"
          href: self-study/theme-5/00_overview.qmd
          contents:
            - href: self-study/theme-5/01_decision_trees.ipynb
              text: "Decision Trees"
            - href: self-study/theme-5/02_random_forests.ipynb
              text: "Random Forests"
            - href: self-study/theme-5/03_gradient_boosting.ipynb
              text: "Gradient Boosting"

        - section: "6. Applied ML Research"
          href: self-study/theme-6/00_overview.qmd
          contents:
            - href: self-study/theme-6/01_communicating_technical_work.qmd
              text: "Communicating Technical Work"
            - href: self-study/theme-6/02_understanding_ml_research.qmd
              text: "Understanding ML Research"
            - href: self-study/theme-6/03_from_research_to_practice.qmd
              text: "Research to Practice"

    # DataLab: DataLab -> Iteration -> page (like Self-study -> Theme -> Activity).
    - section: datalab/00_overview.qmd
      contents:
        - section: datalab/iteration-1/00_overview.qmd
          contents:
            - datalab/iteration-1/01_business_understanding.qmd
            - datalab/iteration-1/02_data_understanding.qmd
            - datalab/iteration-1/03_classification.ipynb
            - datalab/iteration-1/04_regression.ipynb
            - datalab/iteration-1/05_clustering.ipynb
        - section: datalab/iteration-2/00_overview.qmd
          contents:
            - datalab/iteration-2/01_understanding_smiles.qmd
            - datalab/iteration-2/02_understanding_stability_data.ipynb
            - datalab/iteration-2/03_understanding_homolumo_data.ipynb
            - datalab/iteration-2/04_data_preparation.ipynb
            - datalab/iteration-2/05_baseline.ipynb
        - section: datalab/iteration-3/00_overview.qmd
          contents:
            - datalab/iteration-3/01_classification.ipynb
            - datalab/iteration-3/02_regression.ipynb
            - datalab/iteration-3/03_clustering.ipynb
        - datalab/iteration-4/00_overview.qmd
        - datalab/iteration-5/00_overview.qmd
        - datalab/iteration-6/00_overview.qmd

    - href: whats-new.qmd
      text: "What's new"


# Link-preview image of every page. Without this, Quarto takes the first image on a page
# (the logo on the homepage, an SVG elsewhere), and WhatsApp cannot show SVGs.
image: https://ai.buas.nl/open-courses/introduction-to-ml/images/social-card.jpg
image-alt: "Introduction to Machine Learning: learn machine learning by solving a real problem."

format:
  html:
    theme:
      light: [cosmo, theme-fonts.scss]
      dark: [cosmo, theme-fonts.scss, theme-dark.scss]
    css: styles.css
    include-in-header:
      text: |
        <link rel="apple-touch-icon" href="https://ai.buas.nl/open-courses/introduction-to-ml/images/favicon/apple-touch-icon.png">
    filters:
      - filters/colab-button.lua
      - filters/course-route.lua
    toc: true
    number-sections: false