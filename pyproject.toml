[project]
name = "introduction-to-ml"
version = "0.5.1"
description = "Introduction to Machine Learning: an open course from Applied Data Science & AI, Breda University of Applied Sciences."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "openpyxl==3.1.5",
    "matplotlib==3.11.2",

    "scikit-learn==1.9.1",
    "optuna==5.0.0",
    "joblib==1.6.0",
    # Gradient boosting libraries (self-study notebook 011). On macOS, xgboost and lightgbm need
    # the OpenMP runtime: brew install libomp
    "xgboost==3.4.1",
    "lightgbm==4.7.0",
    "catboost==1.2.10",

    # Pinned exactly: molecular descriptors can differ between RDKit versions.
    # 2025.9.3 is the last release with wheels for every platform (incl. Intel Macs).
    "rdkit==2025.9.3",

    "jupyter==1.1.1",
    "ipykernel==7.4.0",
    "ipywidgets==8.1.9",   # progress bars (tqdm, Optuna) in Jupyter
]

[tool.uv]
# This repo is a collection of notebooks, not an installable package.
package = false
# Fail when locking if any dependency has no wheel for one of these platforms.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
