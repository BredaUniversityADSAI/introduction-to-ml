# The course route: the order in which Self-study and DataLab interleave.
# Read by filters/course-route.lua, which
#   - renders the numbered list on course-guide.qmd ("The course route"), wherever
#     a `::: {.course-route}` div is (attribute `from="N"` starts the list at step N);
#   - adds a "Next" callout at the end of the page given as `ends`: from a theme to
#     the iteration of the same step, and from an iteration to the next step.
#
# Each step has two parts: a Self-study theme and the DataLab iteration with the
# same number. Paths are relative to the project root. `title` and `text` are
# Markdown; links in them (and in `finish`) are relative to the project root too.
# `ends`: the last page of the part, in sidebar order (the last part needs none).
# `finish`: optional, shown in that callout before the pointer to the next part.
# Keep `href` and `ends` in step with the sidebar in _quarto.yml.
#
# Readers in VS Code do not see the callout, so the `ends` files also end with a
# "What comes next" note, written from this file by tools/course_route_notes.py
# (the filter removes it on the website). After changing this file, run
#   uv run python tools/course_route_notes.py
# (CI runs it with --check).

steps:
  - parts:
      - title: "Self-study, Theme 1: Foundations of Machine Learning"
        href: self-study/theme-1/00_overview.qmd
        ends: self-study/theme-1/07_review.qmd
        text: "What machine learning is, your first classification, regression and clustering models with scikit-learn, and one small project from start to finish."
      - title: "DataLab, Iteration 1: first ML cycle"
        href: datalab/iteration-1/00_overview.qmd
        ends: datalab/iteration-1/05_clustering.ipynb
        text: "The client's problem and a starter dataset of 80 molecules: your first classification, regression and clustering models for the project."

  - parts:
      - title: "Self-study, Theme 2: Data Preparation & Understanding"
        href: self-study/theme-2/00_overview.qmd
        ends: self-study/theme-2/04_review.qmd
        text: "Preparing data (scaling, encoding, missing values), exploring it (distributions, relationships, PCA), and checking that it matches the data a model will be used on (leakage, distribution shift)."
      - title: "DataLab, Iteration 2: your own dataset"
        href: datalab/iteration-2/00_overview.qmd
        ends: datalab/iteration-2/05_baseline.ipynb
        text: "The raw HOPV files of 350 molecules: understand the stability and HOMO/LUMO data, prepare your own dataset, and train a baseline on it."

  - parts:
      - title: "Self-study, Theme 3: Modeling & Evaluation"
        href: self-study/theme-3/00_overview.qmd
        ends: self-study/theme-3/05_review.qmd
        text: "Cross-validation, hyperparameter tuning and evaluation metrics, then linear regression, logistic regression and clustering: how the models work and how to choose their settings."
      - title: "DataLab, Iteration 3: better evaluation, first submission"
        href: datalab/iteration-3/00_overview.qmd
        ends: datalab/iteration-3/03_clustering.ipynb
        text: "Cross-validation and hyperparameter tuning for your models, a closer look at your clusters, and your first score on the test molecules."
        finish: "Before you continue, score your Iteration 3 models on the test molecules: see [Your first submission](datalab/iteration-3/00_overview.qmd#your-first-submission)."

  - parts:
      - title: "Self-study, Theme 4: Advanced Scikit-Learn"
        href: self-study/theme-4/00_overview.qmd
        ends: self-study/theme-4/02_review.qmd
        text: "Pipelines and the ColumnTransformer: preprocessing and model in one object."
      - title: "DataLab, Iteration 4: streamlined code, new data"
        href: datalab/iteration-4/00_overview.qmd
        ends: datalab/iteration-4/00_overview.qmd
        text: "Rebuild your models as pipelines, add the lab database and the test molecules to your data, and find out why your test score differs from your cross-validation score."

  - parts:
      - title: "Self-study, Theme 5: Tree-Based Algorithms"
        href: self-study/theme-5/00_overview.qmd
        ends: self-study/theme-5/04_review.qmd
        text: "Decision trees, random forests and gradient boosting."
      - title: "DataLab, Iteration 5: better models"
        href: datalab/iteration-5/00_overview.qmd
        ends: datalab/iteration-5/00_overview.qmd
        text: "Tree-based models and boosting on the project, a validation strategy that resembles the test molecules, clustering all molecules, and an analysis of your errors."

  - parts:
      - title: "Self-study, Theme 6: Applied ML Research"
        href: self-study/theme-6/00_overview.qmd
        ends: self-study/theme-6/04_review.qmd
        text: "Communicating technical work, reading ML research, and testing its ideas in your own project."
      - title: "DataLab, Iteration 6: your final solution"
        href: datalab/iteration-6/00_overview.qmd
        text: "Ideas from research papers, your final models scored on the test set, and a write-up of your solution as a portfolio project."
